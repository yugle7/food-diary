<svg xmlns="http://www.w3.org/2000/svg">

    <!-- ==========================================================
         НАВИГАЦИЯ
         ========================================================== -->

    <symbol id="diary" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="8" y1="1" x2="8" y2="3"/>
        <line x1="16" y1="1" x2="16" y2="3"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>

    <symbol id="stats" viewBox="0 0 24 24">
        <circle cx="6" cy="18" r="4" stroke-dasharray="6 1000" stroke-dashoffset="-6"/>
        <line x1="2" y1="1" x2="2" y2="18.2"/>
        <line x1="23" y1="22" x2="5.8" y2="22"/>
        <polyline points="2 18, 8 10, 14 15, 20 6"/>
    </symbol>

    <symbol id="settings" viewBox="0 0 24 24">
        <line x1="2" y1="6" x2="5" y2="6"/>
        <line x1="11" y1="6" x2="22" y2="6"/>
        <line x1="2" y1="18" x2="13" y2="18"/>
        <line x1="19" y1="18" x2="22" y2="18"/>
        <circle cx="8" cy="6" r="3"/>
        <circle cx="16" cy="18" r="3"/>
    </symbol>

    <symbol id="plus" viewBox="0 0 24 24">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
    </symbol>

    <symbol id="person" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="4"/>
        <ellipse cx="12" cy="17" rx="7" ry="3"/>
    </symbol>

    <!-- ==========================================================
         ДЕЙСТВИЯ
         ========================================================== -->

    <symbol id="save" viewBox="0 0 24 24">
        <path d="M2 12L10 20L22 2"/>
    </symbol>

    <symbol id="cancel" viewBox="0 0 24 24">
        <path d="M4 4L20 20M20 4L4 20"/>
    </symbol>

    <symbol id="close" viewBox="0 0 24 24">
        <path d="M6 6L18 18M18 6L6 18"/>
    </symbol>

    <symbol id="check" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3" stroke="var(--help)"/>
        <path d="M7 13L11 17L17 7" stroke="var(--color)"/>
    </symbol>

    <symbol id="edit" viewBox="0 0 24 24">
        <path d="M4 20h4L19 9l-4-4L4 16z"/>
        <line x1="13" y1="7" x2="17" y2="11"/>
    </symbol>

    <symbol id="trash" viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
    </symbol>

    <symbol id="reset" viewBox="0 0 24 24" stroke="var(--red)">
        <path d="M17.8 8.4A6.4 6.4 0 0 0 6.5 6.3L5 8"/>
        <path d="M5 4.5v3.7h3.7"/>
        <path d="M6.2 15.6a6.4 6.4 0 0 0 11.3 2.1L19 16"/>
        <path d="M19 19.5v-3.7h-3.7"/>
    </symbol>

    <symbol id="download" viewBox="0 0 24 24">
        <path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
    </symbol>

    <symbol id="upload" viewBox="0 0 24 24">
        <path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>
    </symbol>

    <!-- ==========================================================
         ВВОД
         ========================================================== -->

    <symbol id="camera" viewBox="0 0 24 24">
        <path d="M3 8.5A2 2 0 0 1 5 6.5h2.2l1.6-2h6.4l1.6 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <circle cx="12" cy="13" r="3.5"/>
    </symbol>

    <symbol id="mic" viewBox="0 0 24 24">
        <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
        <line x1="12" y1="17.5" x2="12" y2="21.5"/>
    </symbol>

    <symbol id="search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5"/>
        <line x1="15.5" y1="15.5" x2="21" y2="21"/>
    </symbol>

    <symbol id="star" viewBox="0 0 24 24">
        <polygon points="12 3 14.8 8.8 21 9.6 16.5 14 17.6 20.2 12 17.3 6.4 20.2 7.5 14 3 9.6 9.2 8.8"/>
    </symbol>

    <symbol id="star-filled" viewBox="0 0 24 24" stroke="var(--yellow)">
        <polygon fill="var(--yellow)" points="12 3 14.8 8.8 21 9.6 16.5 14 17.6 20.2 12 17.3 6.4 20.2 7.5 14 3 9.6 9.2 8.8"/>
    </symbol>

    <!-- ==========================================================
         ЖУРНАЛЫ И МЕТРИКИ
         ========================================================== -->

    <symbol id="flame" viewBox="0 0 24 24">
        <path d="M12 21.5c3.9 0 6.5-2.8 6.5-6.4 0-3.8-2.6-5.8-3.8-9.6-1.9 1.6-2.7 3.5-2.7 5.4-1-.9-1.6-2-1.8-3.5C8 9.2 5.5 11.8 5.5 15.1c0 3.6 2.6 6.4 6.5 6.4z"/>
    </symbol>

    <symbol id="droplet" viewBox="0 0 24 24">
        <path d="M12 3c3.2 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.8-6.8 6-11z"/>
    </symbol>

    <symbol id="moon" viewBox="0 0 24 24">
        <path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>
    </symbol>

    <symbol id="steps" viewBox="0 0 24 24">
        <path d="M7.5 2.5c-1.8 0-3 2.1-3 4.6 0 2.3.9 4.4 2.4 4.4s2.6-1.9 2.6-4.3c0-2.6-.4-4.7-2-4.7z"/>
        <path d="M5 14.5h4v1.8a2 2 0 0 1-4 0z"/>
        <path d="M16.5 7c1.8 0 3 2.1 3 4.6 0 2.3-.9 4.4-2.4 4.4s-2.6-1.9-2.6-4.3c0-2.6.4-4.7 2-4.7z"/>
        <path d="M15 19h4v.8a2 2 0 0 1-4 0z"/>
    </symbol>

    <symbol id="scale" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3.5"/>
        <path d="M7.5 10a4.5 4.5 0 0 1 9 0z"/>
        <line x1="12" y1="10" x2="13.6" y2="7.4"/>
    </symbol>

    <!-- ==========================================================
         СТРЕЛКИ
         ========================================================== -->

    <symbol id="prev" viewBox="0 0 24 24">
        <polyline points="14 6 8 12 14 18"/>
    </symbol>

    <symbol id="next" viewBox="0 0 24 24">
        <polyline points="10 6 16 12 10 18"/>
    </symbol>

    <!-- ==========================================================
         ПРОФИЛЬ
         ========================================================== -->

    <symbol id="heart" viewBox="0 0 24 24" stroke="var(--yellow)">
        <path d="M12 19.2 5.9 14c-2-1.7-2.3-4.7-.7-6.7 1.8-2.2 5-2.2 6.8-.1 1.8-2.1 5-2.1 6.8.1 1.6 2 1.3 5-.7 6.7L12 19.2Z"/>
    </symbol>

    <symbol id="chat" viewBox="0 0 24 24" stroke="var(--blue)">
        <path d="M4.8 11.1C4.8 7.4 8 4.6 12 4.6s7.2 2.8 7.2 6.5-3.2 6.5-7.2 6.5c-1 0-2-.2-2.9-.5L6 19v-3.1c-.8-1.3-1.2-2.9-1.2-4.8Z"/>
    </symbol>

    <symbol id="shield" viewBox="0 0 24 24" stroke="var(--green)">
        <path d="M12 3.8 18.5 6v4.3c0 3.9-2.6 7.3-6.5 8.9-3.9-1.6-6.5-5-6.5-8.9V6L12 3.8Z"/>
    </symbol>

</svg>
